[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "podcnf"
version = "1.1"
authors = [
    {name = "Andrea Violante", email = "violanteandrea15@gmail.com"}
]
description = "Python implementation of pod-cnf"
requires-python = ">=3.10"

dependencies = [
    "numpy<2.0.0", 
    "torch",
    "matplotlib",
    "scikit-learn",
    "tensorboard",
    "torchsummary",
    "scipy",
    "seaborn",
    "tqdm",
    "jupyter",
    "ipykernel"
]

[project.optional-dependencies]
dev = ["pytest", "black"]

[tool.setuptools.packages.find]
where = ["src"]