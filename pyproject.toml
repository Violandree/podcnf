# [build-system]
# Dice a programmi come pip o uv quali strumenti usare per trasformare il codice sorgente in un pacchetto installabile.

[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build_backend = "setuptools.build_meta"

[project]
name = "podcnf"
version = "1.1"
authors = [
    {name = "Andrea Violante", email = "violanteandrea15@gmail.com"}
]
description = "Python implementation of pod-cnf"
requires-python = ">=3.10"

# Contiene nome, versione, descrizione e gli autori. La parte vitale qui è dependencies: 
# qui si elencano i pacchetti essenziali per il funzionamento della libreria.

dependencies = [
    "numpy>=1.24.0",
    "torch",
    "matplotlib",
    "scikit-learn",
    "scipy",
    "seaborn",
    "tqdm",
    "pandas",
    "gdown",
    "pot",
    "dlroms-nicola-r-franco @ git+https://github.com/NicolaRFranco/dlroms.git"
]

[project.optional-dependencies]
# Dipendenze opzionali utilizzate solo per lo sviluppo e l'ambiente notebook
dev = [
    "pytest", 
    "black",
    "jupyter",
    "ipykernel"
]

[tool.setuptools.packages.find]
where = ["src"]